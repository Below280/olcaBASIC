[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "olcabasic"
version = "0.3.0"
description = "A BASIC-like language for controlling openLCA"
readme = "README.md"
license = {text = "MPL-2.0"}
requires-python = ">=3.10"
authors = [{name = "Below280", email = "info@below280.com"}]
keywords = ["lca", "openlca", "basic", "dsl", "life-cycle-assessment"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "b280-olca-mcp>=1.16.0",
]

[project.optional-dependencies]
completion = ["pyreadline3; sys_platform == 'win32'"]

[project.scripts]
olcabasic = "olcabasic.__main__:main"

[project.urls]
Homepage = "https://github.com/Below280/olcaBASIC"
Repository = "https://github.com/Below280/olcaBASIC"
Issues = "https://github.com/Below280/olcaBASIC/issues"

[tool.setuptools.packages.find]
include = ["olcabasic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: needs openLCA with its IPC server on localhost:8080 (run with: pytest -m live)",
    "slow: a live test that takes several minutes",
]
